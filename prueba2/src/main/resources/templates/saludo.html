<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Saludo traducido</title>
    <meta charset="UTF-8">
</head>
<body>

<h1 th:text="#{greeting.message(${nombre})}">
    Saludo
</h1>

<p>
    <a href="/saludo?lang=es">Español</a>
    <a href="/saludo?lang=en">English</a>
    <a href="/saludo?lang=fr">Français</a>
</p>

<form action="/saludo" method="get">
    <label for="nombre">Tu nombre:</label>
    <input type="text" id="nombre" name="nombre">
    <button type="submit">Saludar</button>
</form>

</body>
</html>
