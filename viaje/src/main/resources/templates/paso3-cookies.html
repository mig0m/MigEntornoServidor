<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Planifica tu viaje perfecto - Paso 3</title>
    <style>body {display: grid; justify-content: start; gap: 1rem;}</style>
</head>
<body>
<h1>Planifica tu viaje</h1>
<h2>Paso 3: Actividades y comentarios</h2>
<p th:if="${error != null}" th:text="${error}" style="color: red"></p>
<form th:action="@{/viaje-cookies/resumen}" method="post">
    <h3>¿Qué actividades te gustaría hacer?</h3>
    <label><input type="checkbox" name="actividades" value="Senderismo" th:checked="${actividades != null and actividades.contains('Senderismo')}">Senderismo</label>
    <label><input type="checkbox" name="actividades" value="Museos" th:checked="${actividades != null and actividades.contains('Museos')}">Museos</label>
    <label><input type="checkbox" name="actividades" value="Gastronomía" th:checked="${actividades != null and actividades.contains('Gastronomía')}">Gastronomía</label>
    <label><input type="checkbox" name="actividades" value="Fotografía" th:checked="${actividades != null and actividades.contains('Fotografía')}">Fotografía</label>

    <h3>Comentario opcional</h3>
    <label for="comentario">Escribe un comentario:</label>
    <textarea name="comentario" id="comentario" cols="40" rows="10" th:text="${comentario}"></textarea>

    <button type="submit">Ver el Viaje Perfecto</button>
</form>

<form th:action="@{/viaje-cookies/volver2}" method="post">
    <button type="submit">Volver al paso anterior</button>
</form>
</body>
</html>
