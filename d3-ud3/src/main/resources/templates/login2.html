<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
</head>
<body>
<h1>Iniciar sesión</h1>

<div th:if="${param.error}">Usuario o contraseña incorrectos.</div>
<div th:if="${param.logout}">Has cerrado la sesión correctamente.</div>

<form th:action="@{/login2}" method="post">
    <div>
        <label>Usuario:<input type="text" name="username" required></label>
    </div>
    <div>
        <label>Contraseña:<input type="password" name="password" required></label>
    </div>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Entrar</button>
</form>
<p><a th:href="@{/}">Volver al inicio</a></p>
</body>
</html>
