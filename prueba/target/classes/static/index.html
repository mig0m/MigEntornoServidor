<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de codificación</title>
</head>
<body>
<h1>Prueba de caracteres</h1>

<form action="/recibir" method="get">
  <label for="texto">Texto:</label>
  <input type="text" id="texto" name="texto">
  <button type="submit">Enviar por GET</button>
</form>

<form action="/recibir" method="post">
  <label for="textoPost">Texto:</label>
  <input type="text" id="textoPost" name="texto">
  <button type="submit">Enviar por POST</button>
</form>
</body>
</html>
